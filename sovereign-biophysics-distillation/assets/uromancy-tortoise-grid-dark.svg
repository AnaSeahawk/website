<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" role="img" aria-labelledby="t d">
<title id="t">The nine sectors of the urine bowl, as recorded by Fernand Meyer</title>
<desc id="d">A urine bowl seen from above, head of the tortoise to the south at the top. Two pairs of crossed sticks divide the surface into nine sectors. Down the tortoise's right side from the head: gods, humans, harmful spirits. Down the middle: paternal ancestors, the patient, the offspring. Down the tortoise's left side: cemetery, house, fields. Drawn for a woman's urine, with the tortoise lying on its belly, so its right side falls to the viewer's right.</desc>
<style>
  .ink{fill:#2b2420}.soft{fill:#5f5348}.water{fill:#efe2b8}.rim{stroke:#9a6b1f}
  .stick{stroke:#8a5a2b}.shell{stroke:#3d5a6b}.lab{fill:#2b2420}.mid{fill:#e6d39a}
    .ink{fill:#efe7da}.soft{fill:#c4b7a5}.water{fill:#3f3420}.rim{stroke:#d9a94e}
    .stick{stroke:#d3a36a}.shell{stroke:#9cc3d6}.lab{fill:#f3ead9}.mid{fill:#5a4a26}
  text{font-family:Georgia,'Noto Serif','DejaVu Serif',serif}
</style>

<text x="320" y="42" text-anchor="middle" font-size="27" class="ink">The tortoise of the world</text>
<text x="320" y="70" text-anchor="middle" font-size="15" class="soft">nine sectors on the surface of the urine · seen from above · south at the top</text>

<g transform="translate(320,410)">
  <circle r="240" class="water"/>
  <rect x="-81" y="-81" width="162" height="162" class="mid" opacity=".7"/>
  <circle r="240" fill="none" class="rim" stroke-width="7"/>
  <circle r="226" fill="none" class="rim" stroke-width="1.5" opacity=".55"/>

  <!-- faint tortoise, face down: head south -->
  <g class="shell" fill="none" stroke-width="2.5" opacity=".45">
    <ellipse rx="140" ry="180"/>
    <ellipse cy="-204" rx="26" ry="28"/>
    <path d="M-12,178 L0,214 L12,178"/>
  </g>

  <!-- two pairs of crossed sticks -->
  <g class="stick" stroke-width="8" stroke-linecap="round">
    <line x1="-81" y1="-262" x2="-81" y2="262"/>
    <line x1="81" y1="-262" x2="81" y2="262"/>
    <line x1="-262" y1="-81" x2="262" y2="-81"/>
    <line x1="-262" y1="81" x2="262" y2="81"/>
  </g>

  <!-- sector labels: viewer's left = tortoise's left (east); viewer's right = tortoise's right (west) -->
  <g class="lab" text-anchor="middle" font-size="18">
    <!-- tortoise's left column (viewer's left) -->
    <text x="-158" y="-150">cemetery</text>
    <text x="-170" y="6">house</text>
    <text x="-158" y="162">fields</text>
    <!-- spine column -->
    <text x="0" y="-158">paternal</text><text x="0" y="-136">ancestors</text>
    <text x="0" y="-4" font-weight="bold">the</text><text x="0" y="18" font-weight="bold">patient</text>
    <text x="0" y="150">offspring</text>
    <!-- tortoise's right column (viewer's right) -->
    <text x="158" y="-150">gods</text>
    <text x="170" y="6">humans</text>
    <text x="158" y="150">harmful</text><text x="158" y="172">spirits</text>
  </g>

  <g class="ink" font-size="22" font-weight="bold" text-anchor="middle">
    <text y="-276">S</text><text y="294">N</text>
    <text x="-284" y="8">E</text><text x="284" y="8">W</text>
  </g>
</g>

<g class="soft" font-size="15" text-anchor="middle">
  <text x="148" y="752">tortoise's left</text>
  <text x="320" y="752">spine</text>
  <text x="492" y="752">tortoise's right</text>
</g>
<text x="320" y="792" text-anchor="middle" font-size="17" class="ink">Drawn for a woman's urine: the tortoise lies on its belly, head south.</text>
<text x="320" y="818" text-anchor="middle" font-size="15" class="soft">For a man's, it lies on its back. Each sector is named from the head down.</text>
<text x="320" y="842" text-anchor="middle" font-size="14" class="soft">After Fernand Meyer, "The World in a Bowl of Urine" (1998–99).</text>
</svg>
