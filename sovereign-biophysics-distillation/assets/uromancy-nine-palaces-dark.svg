<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" width="600" height="690" role="img" aria-labelledby="t d">
<title id="t">The nine-square magic square (Luoshu; Tibetan sme ba dgu), south at the top</title>
<desc id="d">A three-by-three grid holding the numbers 4 9 2 in the top row, 3 5 7 in the middle row and 8 1 6 in the bottom row, with south at the top, north at the bottom, east on the left and west on the right. Every row, column and diagonal sums to fifteen. Tibetan astrological charts place this square, the sme ba dgu, on the belly of a cosmic tortoise.</desc>
<style>
  .ink{fill:#2b2420}.soft{fill:#6b5e52}.cell{fill:#f3e8cf}.cellc{fill:#e9d9a8}.line{stroke:#9a6b1f}.num{fill:#3d5a6b}
    .ink{fill:#efe7da}.soft{fill:#b9ab98}.cell{fill:#2e2620}.cellc{fill:#4a3d22}.line{stroke:#d9a94e}.num{fill:#9cc3d6}
  text{font-family:Georgia,'Noto Serif','DejaVu Serif',serif}
</style>
<text x="300" y="44" text-anchor="middle" font-size="27" class="ink">Nine palaces</text>
<text x="300" y="74" text-anchor="middle" font-size="15" class="soft">Chinese Luoshu · Tibetan sme ba dgu · south at the top</text>

<g transform="translate(120,140)">
  <rect x="0" y="0" width="360" height="360" class="cell"/>
  <rect x="120" y="120" width="120" height="120" class="cellc"/>
  <g class="line" stroke-width="3" fill="none">
    <rect x="0" y="0" width="360" height="360"/>
    <path d="M120,0 V360 M240,0 V360 M0,120 H360 M0,240 H360"/>
  </g>
  <g class="num" font-size="56" text-anchor="middle">
    <text x="60" y="80">4</text><text x="180" y="80">9</text><text x="300" y="80">2</text>
    <text x="60" y="200">3</text><text x="180" y="200">5</text><text x="300" y="200">7</text>
    <text x="60" y="320">8</text><text x="180" y="320">1</text><text x="300" y="320">6</text>
  </g>
  <g class="ink" font-size="22" font-weight="bold" text-anchor="middle">
    <text x="180" y="-18">S</text><text x="180" y="392">N</text>
    <text x="-30" y="188">E</text><text x="390" y="188">W</text>
  </g>
</g>
<text x="300" y="590" text-anchor="middle" font-size="18" class="ink">Every row, column and diagonal sums to 15.</text>
<text x="300" y="620" text-anchor="middle" font-size="15" class="soft">Even numbers hold the corners; odd numbers form the cross.</text>
<text x="300" y="648" text-anchor="middle" font-size="15" class="soft">Compare the nine sectors the sticks make on the bowl.</text>
</svg>
